apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: mcp-wasm-router
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      gateway.io/name: mcp-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 8080
          filterChain:
            filter:
              name: 'envoy.filters.network.http_connection_manager'
              subFilter:
                name: 'envoy.filters.http.router'
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.wasm
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
            config:
              name: mcp-routing
              root_id: mcp_routing
              # allow header buffering until body is processed
              # requires Envoy 1.35.0+
              allow_on_headers_stop_iteration:
                value: true
              configuration:
                '@type': type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "brokerHostname": "mcp-broker-router.mcp-system.svc.cluster.local",
                    "brokerPath": "/mcp",
                    "servers": {}
                  }
              vm_config:
                runtime: envoy.wasm.runtime.v8
                code:
                  remote:
                    http_uri:
                      uri: https://ghcr.io/kuadrant/mcp-gateway/mcp-routing:latest
                      timeout: 30s
                    sha256: ""  # populate after publishing
